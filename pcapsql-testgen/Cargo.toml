[package]
name = "pcapsql-testgen"
version.workspace = true
edition = "2021"
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Deterministic PCAP/PCAPNG test-data generator for pcapsql"
keywords = ["pcap", "pcapng", "testing", "fixtures"]
categories = ["development-tools::testing", "network-programming"]

[lib]
name = "pcapsql_testgen"
path = "src/lib.rs"

[[bin]]
name = "pcapgen"
path = "src/bin/pcapgen.rs"

# The library deliberately has NO runtime dependencies: the PRNG (SplitMix64)
# is implemented inline so output is fully reproducible and self-contained.
[dependencies]

# pcap-parser is only used by the round-trip validation tests, to prove the
# generated bytes are parseable by the same version the rest of the workspace
# uses (0.17 via the workspace dependency).
[dev-dependencies]
pcap-parser.workspace = true
