[package]
name = "pcapsql-duckdb-ext"
version.workspace = true
edition = "2024"
rust-version = "1.88"
authors.workspace = true
license.workspace = true
description = "Loadable DuckDB extension for pcapsql: the C API v2 entrypoint"
publish = false

[lib]
# extension-ci-tools looks for lib<extension name>.so in the target directory.
name = "pcapsql"
crate-type = ["cdylib"]
# Only the entrypoint lives here; it is tested by loading the built artifact.
test = false
doctest = false

[dependencies]
pcapsql-duckdb = { path = "..", features = ["loadable"] }
duckdb-neo = { version = "=0.20000.2", default-features = false, features = ["build-extension"] }
