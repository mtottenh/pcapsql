[package]
name = "pcapsql-duckdb"
version.workspace = true
edition.workspace = true
rust-version = "1.88"
authors.workspace = true
license.workspace = true
description = "DuckDB engine glue for pcapsql, on the DuckDB C API v2"
publish = false

[features]
# How the artifact that links this crate reaches DuckDB. `duckdb-neo` makes the two mutually
# exclusive, and exactly one must be on in any binary that calls into DuckDB:
#   loadable  calls go through the function table DuckDB hands a LOADed extension (ext/)
#   static    calls bind to a linked libduckdb (itest/)
# `loadable` is the default because cargo unifies features across the packages of one invocation:
# with it, `cargo build|check|test|clippy --workspace` and `cargo test -p pcapsql-duckdb` need no
# DuckDB library and never see both features. itest/ is outside the workspace and turns the
# default off.
default = ["loadable"]
loadable = ["duckdb-neo/build-extension"]
static = ["duckdb-neo/build-extension-static"]

[dependencies]
pcapsql-core = { path = "../pcapsql-core" }

# Pinned exactly: every V2 function is unstable, so a build only loads in the DuckDB release this
# version targets (2.0.0). Bump together with TARGET_DUCKDB_VERSION in the Makefile.
duckdb-neo = { version = "=0.20000.2", default-features = false }

hex.workspace = true
