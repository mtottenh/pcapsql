name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v1.2.3)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  RELEASE_REF: ${{ github.event.inputs.tag || github.ref }}
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build-deb:
    # On manual dispatch we rebuild nothing; the apt repo is refreshed
    # from the packages already published on the GitHub release.
    if: github.event_name != 'workflow_dispatch'
    strategy:
      matrix:
        include:
          - distro: ubuntu
            version: "20.04"
            codename: focal
            container: ubuntu:20.04
          - distro: ubuntu
            version: "22.04"
            codename: jammy
            container: ubuntu:22.04
          - distro: ubuntu
            version: "24.04"
            codename: noble
            container: ubuntu:24.04
          - distro: debian
            version: "11"
            codename: bullseye
            container: debian:11
          - distro: debian
            version: "12"
            codename: bookworm
            container: debian:12
          - distro: debian
            version: "13"
            codename: trixie
            container: debian:trixie
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
          TZ: Etc/UTC
        run: |
          # Debian 11 is EOL; its packages now live on archive.debian.org
          if [ "${{ matrix.container }}" = "debian:11" ]; then
            sed -i 's|deb.debian.org|archive.debian.org|g' /etc/apt/sources.list
          fi
          apt-get update
          apt-get install -y curl build-essential pkg-config libssl-dev
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y

      - name: Build release binary and .deb package
        run: |
          . $HOME/.cargo/env
          # Stamp the distro codename into the package version
          # (0.4.2-1~jammy1): apt repo pools key files by
          # name_version_arch, so per-distro builds of the same version
          # must have distinct versions or they collide.
          VERSION="${RELEASE_TAG#v}-1~${{ matrix.codename }}1"
          cargo install cargo-deb
          cargo build --release -p pcapsql-datafusion
          cargo deb -p pcapsql-datafusion --no-build --deb-version "$VERSION"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.distro }}-${{ matrix.version }}
          path: target/debian/*.deb

  build-rpm:
    if: github.event_name != 'workflow_dispatch'
    strategy:
      matrix:
        include:
          - distro: fedora
            version: "39"
            container: fedora:39
          - distro: fedora
            version: "40"
            container: fedora:40
          - distro: fedora
            version: "41"
            container: fedora:41
          - distro: el
            version: "8"
            container: rockylinux:8
          - distro: el
            version: "9"
            container: rockylinux:9
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Install build dependencies
        run: |
          # Note: curl-minimal is pre-installed and sufficient for rustup
          dnf install -y gcc openssl-devel
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y

      - name: Build release binary and .rpm package
        run: |
          . $HOME/.cargo/env
          cargo install cargo-generate-rpm
          cargo build --release -p pcapsql-datafusion
          cargo generate-rpm -p pcapsql-datafusion

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.distro }}-${{ matrix.version }}
          path: target/generate-rpm/*.rpm

  apt-repo:
    needs: [release]
    # On manual dispatch, 'release' is skipped; still run to refresh the
    # apt repository from the existing release assets.
    # always() is required: without it a skipped 'release' job skips this
    # one too, regardless of the condition.
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.release.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}

      # Download the .debs published on the GitHub release itself, so the
      # apt repository always serves exactly what the release page does.
      - name: Download deb packages from GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p packages
          gh release download "$RELEASE_TAG" -p '*.deb' -D packages
          ls -la packages/

      - name: Install reprepro
        run: sudo apt-get update && sudo apt-get install -y reprepro

      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.APT_REPO_GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          KEYID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/ {print $5; exit}')
          echo "KEYID=$KEYID" >> "$GITHUB_ENV"

      - name: Check out existing gh-pages branch (or create empty repo tree)
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git worktree add repo gh-pages
          else
            mkdir -p repo
            git -C repo init -b gh-pages
            git -C repo remote add origin "$(git config --get remote.origin.url)"
          fi

      - name: Write reprepro configuration
        env:
          KEYID: ${{ env.KEYID }}
        run: |
          mkdir -p repo/conf
          printf 'db/\nconf/\n' > repo/.gitignore
          cat > repo/conf/distributions <<'EOF'
          Origin: pcapsql
          Label: pcapsql apt repository
          Codename: focal
          Architectures: amd64
          Components: main
          Description: pcapsql packages built for Ubuntu 20.04
          SignWith: __KEYID__

          Origin: pcapsql
          Label: pcapsql apt repository
          Codename: jammy
          Architectures: amd64
          Components: main
          Description: pcapsql packages built for Ubuntu 22.04
          SignWith: __KEYID__

          Origin: pcapsql
          Label: pcapsql apt repository
          Codename: noble
          Architectures: amd64
          Components: main
          Description: pcapsql packages built for Ubuntu 24.04
          SignWith: __KEYID__

          Origin: pcapsql
          Label: pcapsql apt repository
          Codename: bullseye
          Architectures: amd64
          Components: main
          Description: pcapsql packages built for Debian 11
          SignWith: __KEYID__

          Origin: pcapsql
          Label: pcapsql apt repository
          Codename: bookworm
          Architectures: amd64
          Components: main
          Description: pcapsql packages built for Debian 12
          SignWith: __KEYID__

          Origin: pcapsql
          Label: pcapsql apt repository
          Codename: trixie
          Architectures: amd64
          Components: main
          Description: pcapsql packages built for Debian 13
          SignWith: __KEYID__
          EOF
          sed -i "s/__KEYID__/$KEYID/" repo/conf/distributions

      - name: Add packages to repository and sign
        run: |
          set -e
          for pkg in packages/*.deb; do
            [ -f "$pkg" ] || continue
            # Release assets are named pcapsql_<v>_<distro>-<ver>_<arch>.deb
            if ! echo "$pkg" | grep -qE '_(ubuntu|debian)-[0-9]'; then
              echo "Cannot determine suite for $pkg, skipping"
              continue
            fi
            case "$pkg" in
              *_ubuntu-20.04_*) codename=focal ;;
              *_ubuntu-22.04_*) codename=jammy ;;
              *_ubuntu-24.04_*) codename=noble ;;
              *_debian-11_*)    codename=bullseye ;;
              *_debian-12_*)    codename=bookworm ;;
              *_debian-13_*)    codename=trixie ;;
              *) echo "Unknown suite for $pkg, skipping"; continue ;;
            esac
            reprepro --nothingiserror -b repo includedeb "$codename" "$pkg"
          done
          reprepro -b repo export

      - name: Publish public GPG key
        run: gpg --armor --export "$KEYID" > repo/pcapsql.asc

      - name: Push to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update apt repository for ${RELEASE_TAG}" || echo "No changes to commit"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}" HEAD:gh-pages

  release:
    if: github.event_name != 'workflow_dispatch'
    needs: [build-deb, build-rpm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: packages

      - name: Rename packages with distro info
        run: |
          mkdir -p release-assets
          # Process deb packages
          for dir in packages/deb-*; do
            if [ -d "$dir" ]; then
              distro=$(basename "$dir" | sed 's/deb-\(.*\)-\([0-9.]*\)/\1/')
              version=$(basename "$dir" | sed 's/deb-\(.*\)-\([0-9.]*\)/\2/')
              for pkg in "$dir"/*.deb; do
                if [ -f "$pkg" ]; then
                  # Rename: pcapsql-datafusion_0.1.0-1_amd64.deb -> pcapsql_0.1.0-1_ubuntu-20.04_amd64.deb
                  basename=$(basename "$pkg")
                  # Extract version and arch from original name
                  pkg_version=$(echo "$basename" | sed 's/pcapsql-datafusion_\([^_]*\)_.*/\1/')
                  arch=$(echo "$basename" | sed 's/.*_\([^_]*\)\.deb/\1/')
                  newname="pcapsql_${pkg_version}_${distro}-${version}_${arch}.deb"
                  cp "$pkg" "release-assets/$newname"
                fi
              done
            fi
          done
          # Process rpm packages
          for dir in packages/rpm-*; do
            if [ -d "$dir" ]; then
              distro=$(basename "$dir" | sed 's/rpm-\(.*\)-\([0-9.]*\)/\1/')
              version=$(basename "$dir" | sed 's/rpm-\(.*\)-\([0-9.]*\)/\2/')
              for pkg in "$dir"/*.rpm; do
                if [ -f "$pkg" ]; then
                  # Rename: pcapsql-datafusion-0.1.0-1.x86_64.rpm -> pcapsql-0.1.0-1.fedora-40.x86_64.rpm
                  basename=$(basename "$pkg")
                  # Extract version and arch from original name
                  pkg_version=$(echo "$basename" | sed 's/^pcapsql-datafusion-\(.*\)\.[^.]*\.rpm$/\1/')
                  arch=$(echo "$basename" | sed 's/.*\.\([^.]*\)\.rpm/\1/')
                  newname="pcapsql-${pkg_version}.${distro}-${version}.${arch}.rpm"
                  cp "$pkg" "release-assets/$newname"
                fi
              done
            fi
          done
          echo "Release assets:"
          ls -la release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: release-assets/*
          generate_release_notes: true
